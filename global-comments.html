<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>全局评论组件 · Demo</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f7f8fa;
    color: #1f2329;
  }
  textarea { font-family: inherit; }
  /* @提及高亮 */
  .mention {
    color: #3370ff;
    background: rgba(51, 112, 255, .10);
    border-radius: 4px;
    padding: 0 2px;
    font-weight: 500;
  }
  /* 细滚动条 */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #d9dce0; border-radius: 8px; }
  /* toast 动画 */
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
  .toast-anim { animation: toastIn .18s ease-out; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect } = React;

/* ----------------------------- 基础工具 ----------------------------- */

// 当前登录用户 & 可 @ 的成员（模拟）
const CURRENT_USER = { name: "我", color: "#3370ff" };
const MEMBERS = [
  { name: "张伟", color: "#f2994a" },
  { name: "李娜", color: "#eb5757" },
  { name: "王芳", color: "#27ae60" },
  { name: "陈强", color: "#2d9cdb" },
  { name: "刘洋", color: "#9b51e0" },
];

const uid = () => "id" + Math.random().toString(36).slice(2, 9);

// 时间显示：1分钟内「刚刚」；1小时内「x分钟前」；1天内「x小时前」；超过1天显示具体日期
function formatTime(ts) {
  const diff = Date.now() - ts;
  const m = 60000, h = 3600000, d = 86400000;
  if (diff < m) return "刚刚";
  if (diff < h) return Math.floor(diff / m) + "分钟前";
  if (diff < d) return Math.floor(diff / h) + "小时前";
  const dt = new Date(ts);
  const sameYear = dt.getFullYear() === new Date().getFullYear();
  return sameYear
    ? `${dt.getMonth() + 1}月${dt.getDate()}日`
    : `${dt.getFullYear()}年${dt.getMonth() + 1}月${dt.getDate()}日`;
}

// 把 @名字 渲染为高亮片段
function renderContent(text) {
  const parts = String(text).split(/(@[^\s@，。！？、]+)/g);
  return parts.map((p, i) =>
    p.startsWith("@")
      ? <span key={i} className="mention">{p}</span>
      : <React.Fragment key={i}>{p}</React.Fragment>
  );
}

// 模拟发送：600ms 延迟；fail=true 时 reject
function fakePublish(fail) {
  return new Promise((res, rej) => setTimeout(() => (fail ? rej(new Error("fail")) : res()), 600));
}

/* ----------------------------- 图标 ----------------------------- */
const Ic = {
  lockClosed: () => (<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>),
  lockOpen: () => (<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>),
  more: () => (<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>),
  check: () => (<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5"/></svg>),
  chevron: () => (<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6"/></svg>),
  comment: () => (<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>),
};

function Avatar({ name, color, size = 32 }) {
  const ch = (name || "?").slice(0, 1);
  return (
    <div className="rounded-full flex items-center justify-center text-white font-medium select-none shrink-0"
      style={{ width: size, height: size, background: color, fontSize: size * 0.4 }}>
      {ch}
    </div>
  );
}

/* ----------------------------- Toast ----------------------------- */
function Toast({ msg, type }) {
  return (
    <div className="fixed left-1/2 -translate-x-1/2 bottom-24 z-[60] toast-anim">
      <div className={"px-4 py-2 rounded-lg shadow-lg text-sm text-white flex items-center gap-1.5 " + (type === "error" ? "bg-rose-500" : "bg-slate-800")}>
        <span>{type === "error" ? "⚠️" : "✓"}</span>
        <span>{msg}</span>
      </div>
    </div>
  );
}

/* ----------------------------- 空状态 ----------------------------- */
function EmptyState() {
  return (
    <div className="flex flex-col items-center justify-center py-16 text-center select-none">
      <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#d4d7dd" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        <path d="M8.5 11h7M8.5 8h7M8.5 14h3.5" stroke="#e3e6ea"/>
      </svg>
      <p className="mt-3 text-sm text-slate-400">暂无评论，来发表第一条吧</p>
    </div>
  );
}

/* ----------------------------- 输入框（含 @提及 / 私有开关） ----------------------------- */
function Composer({ onSend, toast, placeholder = "写下你的评论，输入 @ 可提及成员", compact = false, showPrivate = true }) {
  const [value, setValue] = useState("");
  const [isPrivate, setPrivate] = useState(false);
  const [mention, setMention] = useState(null); // { query, start }
  const [simFail, setSimFail] = useState(false);
  const [sending, setSending] = useState(false);
  const taRef = useRef(null);

  const detectMention = (v, caret) => {
    const upto = v.slice(0, caret);
    const m = upto.match(/(?:^|\s)@([^\s@]*)$/);
    if (m) setMention({ query: m[1], start: caret - m[1].length - 1 });
    else setMention(null);
  };

  const onChange = (e) => {
    const v = e.target.value;
    setValue(v);
    detectMention(v, e.target.selectionStart);
  };

  const insertMention = (name) => {
    const ta = taRef.current;
    const caret = ta.selectionStart;
    const s = mention ? mention.start : caret;
    const before = value.slice(0, s);
    const after = value.slice(caret);
    const nv = before + "@" + name + " " + after;
    setValue(nv);
    setMention(null);
    requestAnimationFrame(() => {
      ta.focus();
      const pos = nv.length - after.length;
      ta.setSelectionRange(pos, pos);
    });
  };

  const filtered = mention ? MEMBERS.filter((m) => m.name.includes(mention.query)) : [];

  const submit = async () => {
    const t = value.trim();
    if (!t || sending) return;
    setSending(true);
    try {
      await fakePublish(simFail);
      onSend(t, isPrivate);
      setValue("");
      setPrivate(false);
      toast("评论成功");
    } catch (e) {
      toast("发送失败，请重试", "error"); // 保留输入框内容
    } finally {
      setSending(false);
    }
  };

  const onKeyDown = (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); submit(); }
  };

  return (
    <div>
      <div className="relative">
        {mention && filtered.length > 0 && (
          <div className="absolute bottom-full mb-2 left-0 w-52 bg-white border border-slate-200 rounded-xl shadow-lg py-1 z-30">
            <div className="px-3 py-1 text-[11px] text-slate-300">选择成员</div>
            {filtered.map((m) => (
              <button key={m.name} type="button" onClick={() => insertMention(m.name)}
                className="w-full flex items-center gap-2 px-3 py-2 text-left hover:bg-slate-50">
                <Avatar name={m.name} color={m.color} size={24} />
                <span className="text-sm text-slate-700">{m.name}</span>
              </button>
            ))}
          </div>
        )}
        <textarea ref={taRef} value={value} onChange={onChange} onClick={(e) => detectMention(value, e.target.selectionStart)}
          onKeyUp={(e) => detectMention(value, e.target.selectionStart)} onKeyDown={onKeyDown}
          placeholder={placeholder} rows={compact ? 2 : 3}
          className="w-full resize-none rounded-xl border border-slate-200 px-3 py-2.5 text-sm leading-relaxed outline-none transition focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100" />
      </div>

      <div className="mt-2 flex items-center justify-between">
        <div className="flex items-center gap-3">
          {showPrivate && (
            <button type="button" onClick={() => setPrivate((p) => !p)} title="私有评论"
              className={"flex items-center gap-1 text-xs px-2 py-1 rounded-md transition " + (isPrivate ? "text-indigo-600 bg-indigo-50" : "text-slate-400 hover:text-slate-600 hover:bg-slate-100")}>
              {isPrivate ? <Ic.lockClosed /> : <Ic.lockOpen />}
              {isPrivate ? "仅特定人员可见" : "私有"}
            </button>
          )}
          <button type="button" onClick={() => setSimFail((f) => !f)} title="演示用：开启后发送会失败"
            className={"text-[11px] transition " + (simFail ? "text-rose-400" : "text-slate-300 hover:text-slate-400")}>
            {simFail ? "✓ 模拟发送失败" : "模拟失败"}
          </button>
        </div>
        <button type="button" onClick={submit} disabled={!value.trim() || sending}
          className="px-4 py-1.5 rounded-lg bg-indigo-600 text-white text-sm font-medium transition disabled:opacity-40 disabled:cursor-not-allowed hover:bg-indigo-700">
          {sending ? "发送中…" : "发送"}
        </button>
      </div>
    </div>
  );
}

/* ----------------------------- 单条回复 ----------------------------- */
function ReplyCard({ r, onEditReply, onDeleteReply, toast }) {
  const isMine = r.author.name === CURRENT_USER.name;
  const [editing, setEditing] = useState(false);
  const [editVal, setEditVal] = useState(r.content);
  const [menuOpen, setMenuOpen] = useState(false);

  const save = () => {
    const t = editVal.trim();
    if (!t) return;
    onEditReply(t);
    setEditing(false);
  };

  return (
    <div className="relative flex gap-2.5">
      <Avatar name={r.author.name} color={r.author.color} size={26} />
      <div className="flex-1 min-w-0">
        <div className="flex items-center gap-2">
          <span className="text-[13px] font-semibold text-slate-800">{r.author.name}</span>
          <span className="text-[11px] text-slate-400">{formatTime(r.createdAt)}</span>
          {r.edited && <span className="text-[11px] text-slate-300">已编辑</span>}
          {isMine && (
            <div className="relative ml-auto">
              <button onClick={() => setMenuOpen((o) => !o)} className="p-1 rounded text-slate-300 hover:text-slate-500 hover:bg-slate-100">
                <Ic.more />
              </button>
              {menuOpen && (
                <>
                  <div className="fixed inset-0 z-20" onClick={() => setMenuOpen(false)} />
                  <div className="absolute right-0 top-full mt-1 w-28 bg-white border border-slate-200 rounded-lg shadow-lg py-1 z-30 text-sm">
                    <button className="w-full text-left px-3 py-1.5 hover:bg-slate-50 text-slate-600" onClick={() => { setEditing(true); setMenuOpen(false); }}>编辑</button>
                    <button className="w-full text-left px-3 py-1.5 hover:bg-slate-50 text-rose-500" onClick={() => { if (window.confirm("确定删除这条回复？")) onDeleteReply(); setMenuOpen(false); }}>删除</button>
                  </div>
                </>
              )}
            </div>
          )}
        </div>
        {editing ? (
          <div className="mt-1.5">
            <textarea value={editVal} onChange={(e) => setEditVal(e.target.value)} rows={2} className="w-full resize-none rounded-lg border border-slate-200 px-2.5 py-1.5 text-[13px] outline-none focus:border-indigo-400" />
            <div className="mt-1 flex justify-end gap-2">
              <button className="px-2.5 py-1 text-xs rounded-md text-slate-500 hover:bg-slate-100" onClick={() => { setEditing(false); setEditVal(r.content); }}>取消</button>
              <button className="px-2.5 py-1 text-xs rounded-md bg-indigo-600 text-white hover:bg-indigo-700" onClick={save}>保存</button>
            </div>
          </div>
        ) : (
          <div className="mt-0.5 text-[13px] text-slate-700 leading-relaxed whitespace-pre-wrap">{renderContent(r.content)}</div>
        )}
      </div>
    </div>
  );
}

/* ----------------------------- 评论卡片 ----------------------------- */
function CommentCard({ c, onReply, onResolve, onEdit, onDelete, onEditReply, onDeleteReply, toast }) {
  const [replying, setReplying] = useState(false);
  const [editing, setEditing] = useState(false);
  const [editVal, setEditVal] = useState(c.content);
  const [menuOpen, setMenuOpen] = useState(false);
  const [expanded, setExpanded] = useState(false);
  const isMine = c.author.name === CURRENT_USER.name;

  // 已解决且未展开：折叠为一条细栏
  if (c.isResolved && !expanded) {
    return (
      <div className="flex items-center gap-2 py-2 px-3 rounded-lg bg-slate-50 text-slate-400 text-sm cursor-pointer transition hover:bg-slate-100"
        onClick={() => setExpanded(true)}>
        <Ic.check />
        <span>已解决 · {c.author.name}</span>
        <span className="ml-auto flex items-center gap-0.5 text-xs">展开 <Ic.chevron /></span>
      </div>
    );
  }

  const saveEdit = () => {
    const t = editVal.trim();
    if (!t) return;
    onEdit(t);
    setEditing(false);
  };

  return (
    <div className={"group relative rounded-xl border px-4 py-3 transition " + (c.isPrivate ? "bg-slate-50 border-slate-200" : c.isResolved ? "bg-white border-slate-100 opacity-70" : "bg-white border-slate-100 shadow-sm")}>
      <div className="flex gap-3">
        <Avatar name={c.author.name} color={c.author.color} size={32} />
        <div className="flex-1 min-w-0">
          <div className="flex items-center gap-2">
            <span className="text-sm font-semibold text-slate-800">{c.author.name}</span>
            {c.isPrivate && <span className="text-[10px] px-1.5 py-0.5 rounded bg-slate-200 text-slate-500">私有</span>}
            <span className="text-xs text-slate-400">{formatTime(c.createdAt)}</span>
            {c.edited && <span className="text-[11px] text-slate-300">已编辑</span>}
            <div className="relative ml-auto">
              <button onClick={() => setMenuOpen((o) => !o)} className="p-1 rounded text-slate-300 hover:text-slate-500 hover:bg-slate-100">
                <Ic.more />
              </button>
              {menuOpen && (
                <>
                  <div className="fixed inset-0 z-20" onClick={() => setMenuOpen(false)} />
                  <div className="absolute right-0 top-full mt-1 w-32 bg-white border border-slate-200 rounded-lg shadow-lg py-1 z-30 text-sm">
                    <button className="w-full text-left px-3 py-1.5 hover:bg-slate-50 text-slate-600" onClick={() => { onResolve(); setMenuOpen(false); }}>
                      {c.isResolved ? "取消解决" : "标记为已解决"}
                    </button>
                    {isMine && <button className="w-full text-left px-3 py-1.5 hover:bg-slate-50 text-slate-600" onClick={() => { setEditing(true); setMenuOpen(false); }}>编辑</button>}
                    {isMine && <button className="w-full text-left px-3 py-1.5 hover:bg-slate-50 text-rose-500" onClick={() => { if (window.confirm("确定删除这条评论？")) onDelete(); setMenuOpen(false); }}>删除</button>}
                  </div>
                </>
              )}
            </div>
          </div>

          {editing ? (
            <div className="mt-2">
              <textarea value={editVal} onChange={(e) => setEditVal(e.target.value)} rows={2} className="w-full resize-none rounded-lg border border-slate-200 px-3 py-2 text-sm outline-none focus:border-indigo-400" />
              <div className="mt-1 flex justify-end gap-2">
                <button className="px-3 py-1 text-xs rounded-md text-slate-500 hover:bg-slate-100" onClick={() => { setEditing(false); setEditVal(c.content); }}>取消</button>
                <button className="px-3 py-1 text-xs rounded-md bg-indigo-600 text-white hover:bg-indigo-700" onClick={saveEdit}>保存</button>
              </div>
            </div>
          ) : (
            <div className="mt-1 text-sm text-slate-700 leading-relaxed whitespace-pre-wrap">{renderContent(c.content)}</div>
          )}

          <div className="mt-2 flex items-center gap-3">
            <button className="text-xs text-slate-400 hover:text-indigo-600 transition" onClick={() => setReplying((r) => !r)}>回复</button>
          </div>

          {replying && (
            <div className="mt-2">
              <Composer compact placeholder={"回复 @" + c.author.name} showPrivate={false} toast={toast}
                onSend={(t) => { onReply(t); setReplying(false); }} />
            </div>
          )}

          {c.replies.length > 0 && (
            <div className="mt-3 space-y-3 border-l-2 border-slate-100 pl-3">
              {c.replies.map((r) => (
                <ReplyCard key={r.id} r={r}
                  onEditReply={(t) => onEditReply(r.id, t)}
                  onDeleteReply={() => onDeleteReply(r.id)}
                  toast={toast} />
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ----------------------------- 全局评论组件（可复用） ----------------------------- */
function GlobalComments({ initialComments = [] }) {
  const [comments, setComments] = useState(initialComments);
  const [toast, setToast] = useState(null);
  const sectionRef = useRef(null);
  const toastTimer = useRef(null);

  const showToast = (msg, type = "success") => {
    setToast({ msg, type });
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2000);
  };

  const addComment = (text, isPrivate) => {
    setComments((prev) => [
      ...prev,
      { id: uid(), author: CURRENT_USER, content: text, createdAt: Date.now(), isPrivate, isResolved: false, edited: false, replies: [] },
    ]);
  };
  const addReply = (pid, text) => {
    setComments((prev) => prev.map((c) => c.id === pid ? { ...c, replies: [...c.replies, { id: uid(), author: CURRENT_USER, content: text, createdAt: Date.now(), edited: false }] } : c));
    showToast("评论成功");
  };
  const toggleResolve = (id) => setComments((prev) => prev.map((c) => c.id === id ? { ...c, isResolved: !c.isResolved } : c));
  const editComment = (id, text) => setComments((prev) => prev.map((c) => c.id === id ? { ...c, content: text, edited: true } : c));
  const editReply = (pid, rid, text) => setComments((prev) => prev.map((c) => c.id === pid ? { ...c, replies: c.replies.map((r) => r.id === rid ? { ...r, content: text, edited: true } : r) } : c));
  const deleteComment = (id) => setComments((prev) => prev.filter((c) => c.id !== id));
  const deleteReply = (pid, rid) => setComments((prev) => prev.map((c) => c.id === pid ? { ...c, replies: c.replies.filter((r) => r.id !== rid) } : c));

  const total = comments.reduce((n, c) => n + 1 + c.replies.length, 0);
  const scrollToSection = () => sectionRef.current?.scrollIntoView({ behavior: "smooth", block: "start" });

  return (
    <React.Fragment>
      {/* 右下角悬浮入口 */}
      <button onClick={scrollToSection}
        className="fixed bottom-6 right-6 z-50 flex items-center gap-2 px-4 py-2.5 rounded-full bg-white border border-slate-200 shadow-lg text-slate-700 text-sm font-medium transition hover:shadow-xl hover:-translate-y-0.5 active:translate-y-0">
        <Ic.comment />
        <span>查看全文评论</span>
        {total > 0 && (
          <span className="ml-0.5 min-w-[20px] h-5 px-1.5 rounded-full bg-indigo-600 text-white text-[11px] flex items-center justify-center">{total}</span>
        )}
      </button>

      {/* 文档底部全局评论区 */}
      <section ref={sectionRef} id="global-comments" className="max-w-3xl mx-auto px-6 mt-10 pt-6 border-t border-slate-200">
        <div className="flex items-center gap-2 mb-4">
          <h2 className="text-base font-semibold text-slate-800">全文评论</h2>
          <span className="text-sm text-slate-400">{total}</span>
        </div>

        <div className="mb-6 rounded-2xl border border-slate-200 bg-white p-4">
          <Composer onSend={addComment} toast={showToast} />
        </div>

        {comments.length === 0 ? (
          <EmptyState />
        ) : (
          <div className="space-y-3 pb-10">
            {comments.map((c) => (
              <CommentCard key={c.id} c={c}
                onReply={(t) => addReply(c.id, t)}
                onResolve={() => toggleResolve(c.id)}
                onEdit={(t) => editComment(c.id, t)}
                onDelete={() => deleteComment(c.id)}
                onEditReply={(rid, t) => editReply(c.id, rid, t)}
                onDeleteReply={(rid) => deleteReply(c.id, rid)}
                toast={showToast} />
            ))}
          </div>
        )}
      </section>

      {toast && <Toast msg={toast.msg} type={toast.type} />}
    </React.Fragment>
  );
}

/* ----------------------------- Demo 文档 + 初始数据 ----------------------------- */
